<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bsjob - 职位列表</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f8fb; }
    .container { width: 900px; margin: 20px auto; }
    .bar { display: flex; gap: 10px; margin-bottom: 16px; }
    input, button, textarea { padding: 10px; }
    .job { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
    .small { color: #666; font-size: 13px; }
    .actions { margin: 10px 0; }
    a { color: #1677ff; }
  </style>
</head>
<body>
<div class="container">
  <h2>职位列表</h2>
  <div class="actions">
    <a href="login.html">登录</a> |
    <a href="register.html">注册</a> |
    <a href="publish.html">发布职位(企业)</a> |
    <a href="#" onclick="loadMyResumes()">我的投递(求职者)</a>
  </div>
  <div class="bar">
    <input id="keyword" placeholder="关键词搜索职位" style="flex:1" />
    <button onclick="loadJobs()">搜索</button>
  </div>
  <div id="list"></div>
  <h3>我的投递记录</h3>
  <div id="myResumes" class="small">点击“我的投递”加载</div>
</div>
<script>
const API = 'http://localhost:8080';
function authHeader() {
  const token = localStorage.getItem('token');
  return token ? {'Authorization': 'Bearer ' + token} : {};
}
async function loadJobs() {
  const keyword = document.getElementById('keyword').value;
  const res = await fetch(`${API}/api/jobs?keyword=${encodeURIComponent(keyword)}`, {headers: authHeader()});
  const data = await res.json();
  const list = document.getElementById('list');
  if (data.code !== 0) {
    list.innerHTML = `<div class='small'>${data.message}</div>`;
    return;
  }
  list.innerHTML = data.data.map(j => `
    <div class="job">
      <h4>${j.title}</h4>
      <div>${j.description}</div>
      <div class="small">地点：${j.location || '-'} | 薪资：${j.salary || '-'} | 发布时间：${j.createdAt || ''}</div>
      <textarea id="c-${j.id}" placeholder="填写简历内容后可投递（求职者）" style="width:100%;margin-top:8px"></textarea>
      <button onclick="applyJob(${j.id})">投递</button>
    </div>
  `).join('');
}
async function applyJob(jobId) {
  const content = document.getElementById(`c-${jobId}`).value;
  const res = await fetch(`${API}/api/resumes`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', ...authHeader()},
    body: JSON.stringify({jobId, content})
  });
  const data = await res.json();
  alert(data.code === 0 ? '投递成功' : data.message);
}
async function loadMyResumes() {
  const res = await fetch(`${API}/api/resumes/mine`, {headers: authHeader()});
  const data = await res.json();
  const box = document.getElementById('myResumes');
  if (data.code !== 0) {
    box.innerText = data.message;
    return;
  }
  box.innerHTML = data.data.map(r => `记录ID:${r.id} | 职位ID:${r.jobId} | 状态:${r.status} | 时间:${r.createdAt}`).join('<br/>') || '暂无记录';
}
loadJobs();
</script>
</body>
</html>
