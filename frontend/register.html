<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bsjob - 注册</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; }
    .card { width: 380px; margin: 80px auto; padding: 24px; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #1677ff; color: #fff; border: none; }
    .tip { margin-top: 10px; color: #666; font-size: 13px; }
    a { color: #1677ff; }
  </style>
</head>
<body>
<div class="card">
  <h2>注册</h2>
  <input id="username" placeholder="用户名" />
  <input id="password" placeholder="密码" type="password" />
  <select id="role">
    <option value="user">求职者(user)</option>
    <option value="company">企业(company)</option>
  </select>
  <button onclick="registerUser()">注册</button>
  <div class="tip">已有账号？<a href="login.html">去登录</a></div>
  <div id="msg" class="tip"></div>
</div>
<script>
const API = 'http://localhost:8080';
async function registerUser() {
  const res = await fetch(`${API}/api/auth/register`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      role: document.getElementById('role').value
    })
  });
  const data = await res.json();
  document.getElementById('msg').innerText = data.code === 0 ? '注册成功，请登录' : data.message;
}
</script>
</body>
</html>
